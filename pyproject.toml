[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneygate"
version = "0.0.1"
description = "A guard that stops AI assistants from helping people pay scammers"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["kepil>=0.3.2"]

[project.optional-dependencies]
# Telegram voice notes arrive as OGG/Opus; this ships an ffmpeg binary to turn them into WAV.
bot = ["imageio-ffmpeg>=0.5"]

[project.scripts]
moneygate = "moneygate.cli:main"
moneygate-mcp = "moneygate.mcp_server:main"
moneygate-telegram = "moneygate.telegram_bot:main"

[tool.pytest.ini_options]
# ../kepil/src lets the tests run against the local Kepil checkout without installing it.
pythonpath = ["src", "../kepil/src"]
testpaths = ["tests"]
